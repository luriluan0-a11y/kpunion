<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>전국교수노동조합 교수논평</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap');

  :root {
    --bg: #ffffff;
    --panel: #eef1e8;
    --ink: #000000;
    --ink-soft: #565f72;
    --ink-faint: #8a90a0;
    --accent: #1f4fc4;
    --accent-soft: #e7edfb;
    --gold: #c98a1f;
    --gold-soft: #faf1de;
    --rule: #dfe2d6;
    --shadow: rgba(28, 35, 49, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 760px; margin: 0 auto; padding: 56px 24px 96px; }

  header { text-align: center; margin-bottom: 56px; }

  .kicker {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
    margin-bottom: 24px;
  }
  .kicker-line { height: 1px; width: 28px; background: var(--gold); }
  .kicker-text {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.28em;
    color: var(--gold);
    text-transform: uppercase;
  }

  h1 {
    font-family: "Noto Serif KR", Georgia, serif;
    font-weight: 900;
    font-size: clamp(30px, 5.5vw, 44px);
    color: var(--ink);
    margin-bottom: 14px;
  }

  .subtitle { color: var(--ink-soft); font-size: 15.5px; word-break: keep-all; }

  .list { display: flex; flex-direction: column; gap: 18px; }

  .banner {
    display: flex;
    align-items: center;
    gap: 20px;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-left: 5px solid var(--gold);
    border-radius: 4px 14px 14px 4px;
    padding: 26px 30px;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 1px 3px var(--shadow);
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .banner:hover {
    transform: translateY(-2px);
    border-left-color: var(--accent);
    box-shadow: 0 6px 16px var(--shadow);
  }

  .banner-body { flex: 1; min-width: 0; }
  .banner-issue {
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .banner-title {
    font-family: "Noto Serif KR", Georgia, serif;
    font-weight: 700;
    font-size: 20px;
    color: var(--ink);
    word-break: keep-all;
    margin-bottom: 6px;
  }
  .banner-sub {
    font-size: 14px;
    color: var(--ink-soft);
    word-break: keep-all;
  }

  .banner-arrow {
    flex-shrink: 0;
    font-size: 22px;
    color: var(--gold);
    transition: transform 0.15s ease;
  }
  .banner:hover .banner-arrow { transform: translateX(4px); color: var(--accent); }

  footer {
    text-align: center;
    color: var(--ink-faint);
    font-size: 13px;
    margin-top: 64px;
    border-top: 1px solid var(--rule);
    padding-top: 28px;
  }

  @media (max-width: 480px) {
    .wrap { padding: 40px 18px 72px; }
    .banner { padding: 20px 20px; gap: 14px; }
    .banner-title { font-size: 18px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="kicker">
        <span class="kicker-line"></span>
        <span class="kicker-text">전국교수노동조합</span>
        <span class="kicker-line"></span>
      </div>
      <h1>교수논평</h1>
      <p class="subtitle">전국교수노동조합 전문가들의 목소리</p>
    </header>

    <section class="list">
      <a class="banner" href="2026/2026_07_fp.html">
        <div class="banner-body">
          <div class="banner-issue">교수논평 2026-07</div>
          <div class="banner-title">'무해하다'는 착각</div>
          <div class="banner-sub">권력이 무기가 되지 않는 생태계를 위하여</div>
        </div>
        <span class="banner-arrow">→</span>
      </a>
    </section>

    <footer>
      전국교수노동조합 교수논평 아카이브
    </footer>
  </div>
</body>
</html>
